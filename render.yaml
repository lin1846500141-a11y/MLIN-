# Render Blueprint：同一 Web Service 同时运行 Next.js 与 FastAPI。
services:
  - type: web
    name: mlin
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: BACKEND_API_URL
        value: http://127.0.0.1:8000
